# One `docker compose up` brings up the whole forecourt: RabbitMQ, the acquiring host
# simulator, and the site controller — which now also serves the Angular operator console,
# runs the outdoor payment terminal in-process, and launches one pump-firmware process per
# dispenser (Phase 6, superseding the Phase 5 scope note in docs/adr/0018).
#
# The browser is the demo: http://localhost:8080
services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  host-simulator:
    build:
      context: ..
      dockerfile: src/OpenForecourt.HostSimulator/Dockerfile
    ports:
      - "9583:9583"

  site-controller:
    build:
      context: ..
      dockerfile: src/OpenForecourt.SiteController/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      host-simulator:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      Site__HostEndpoint: "host-simulator:9583"
      Site__RabbitMqUri: "amqp://guest:guest@rabbitmq:5672"
      Site__JournalPath: "/data/forecourt-journal.db"
      Site__HostProbeInterval: "00:00:02"
      Site__PumpCount: "8"
      # The firmware host build, the card profiles and the test BDK are copied into the image
      # by src/OpenForecourt.SiteController/Dockerfile. Test data only (CLAUDE.md section 7).
      Site__PumpFirmwarePath: "/app/firmware/pump_host"
      Site__CardProfilesPath: "/app/cards"
      Site__PinBdkPath: "/app/keys/bdk.hex"
    volumes:
      - journal:/data

volumes:
  journal:
