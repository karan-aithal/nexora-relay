name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Puts a "Run workflow" button on the Actions tab, so a run can be triggered by hand
  # against any branch without pushing a commit.
  workflow_dispatch:

jobs:
  build-test:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # global.json pins the SDK, so CI compiles with the same analyzer set as a developer
      # machine. Without it a new SDK patch can add an analyzer rule that fails the build here
      # and nowhere else (warnings are errors — CLAUDE.md section 6).
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # OpenForecourt.CI.slnf excludes the Windows-only adapters
      # (Adapters.Pcsc, Adapters.Serial — net10.0-windows), which cannot
      # build on Linux. The full solution builds on Windows dev machines.
      - name: Restore
        run: dotnet restore OpenForecourt.CI.slnf

      - name: Build
        run: dotnet build OpenForecourt.CI.slnf --no-restore --configuration Release

      - name: Test
        run: dotnet test OpenForecourt.CI.slnf --no-build --configuration Release --verbosity normal

  firmware:
    name: Firmware (host build, cppcheck, ARM cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake cppcheck gcc-arm-none-eabi

      # Host build: the portable C core against the host HAL, run as a normal executable.
      - name: Configure host build
        run: cmake -S firmware/pump -B firmware/pump/build-host -DHAL=host

      - name: Build host (warnings are errors)
        run: cmake --build firmware/pump/build-host

      - name: Run C tests
        run: ctest --test-dir firmware/pump/build-host --output-on-failure

      # cppcheck must be clean (CLAUDE.md section 6).
      - name: cppcheck
        run: >
          cppcheck --enable=warning,style,performance,portability
          --error-exitcode=1 --inline-suppr --std=c11 --quiet
          -Ifirmware/pump/src -Ifirmware/pump/hal
          firmware/pump/src firmware/pump/hal/host firmware/pump/hal/target firmware/pump/test

      # Target build: the IDENTICAL core compiled for a Cortex-M4 STM32. Archived
      # compile-only (no link/flash) — this is the portability proof, never executed here.
      - name: Configure target (cross-compile) build
        run: >
          cmake -S firmware/pump -B firmware/pump/build-target -DHAL=target
          -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/firmware/pump/cmake/arm-none-eabi.cmake"

      - name: Build target (arm-none-eabi)
        run: cmake --build firmware/pump/build-target

  dashboard:
    name: Operator console (build, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/forecourt-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/forecourt-dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (strict templates, no implicit any)
        run: npm run build

      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-end fuelling (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/forecourt-dashboard/package-lock.json

      # The end-to-end run drives the real firmware, so the host build has to exist first.
      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Build the pump firmware host
        run: |
          cmake -S firmware/pump -B firmware/pump/build-host -DHAL=host
          cmake --build firmware/pump/build-host

      # Playwright starts the site controller and the acquirer simulator with `dotnet run`.
      # Building them here means that start-up is a launch, not a cold restore-and-compile,
      # which is what the webServer timeout is actually budgeted for.
      - name: Build the site controller and the acquirer simulator
        run: |
          dotnet build src/OpenForecourt.SiteController/OpenForecourt.SiteController.csproj -c Release
          dotnet build src/OpenForecourt.HostSimulator/OpenForecourt.HostSimulator.csproj -c Release

      - name: Install dashboard dependencies
        working-directory: web/forecourt-dashboard
        run: npm ci

      - name: Install Playwright browser
        working-directory: web/forecourt-dashboard
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end fuelling
        working-directory: web/forecourt-dashboard
        run: npm run e2e

      # Traces are written per failing test; there is no HTML report under the CI reporter.
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/forecourt-dashboard/test-results/
          if-no-files-found: ignore
          retention-days: 7
